app-id: io.gitlab.JBeaumont81.Etesync-Knotes
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: etesync-knotes
separate-locales: false
rename-desktop-file: etesync-knotes.desktop
rename-icon: etesync-knotes
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri

modules:
  - name: libetebase
    buildsystem: simple
    build-commands:
      - . /usr/lib/sdk/rust-stable/enable.sh && cargo build --release --offline
      - install -Dm755 target/release/libetebase.so "${FLATPAK_DEST}/lib/libetebase.so"
      - ln -sf "${FLATPAK_DEST}/lib/libetebase.so" "${FLATPAK_DEST}/lib/libetebase.so.0"
    sources:
      - type: git
        url: https://github.com/etesync/libetebase.git
        tag: v0.5.8
        commit: 49e67feaa4770dff07acad0fab282e17a3a9c508
      - type: inline
        dest: .cargo
        dest-filename: config.toml
        contents: |
          [source.crates-io]
          replace-with = "vendored-sources"
          [source.vendored-sources]
          directory = "cargo/vendor"
      - cargo-sources.json

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dvapi=false
      - -Dintrospection=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: 0.21.7
        commit: 0936f740c02b60f02657729cd99f581db4517a41

  - name: etesync-knotes
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://codeberg.org/Josselin_Beaumont/Etesync-Knotes.git
        tag: v2.0
        commit: 753a1e26f02b224e57117acd8253f677a7c74f34
